<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hitanorain 的游戏厅</title>
<meta name="description" content="Hitanorain 做的网页游戏合集：欢乐连连看、观星者基金、织星、星叶守望、企鹅跑酷、Moon英语。">
<meta name="theme-color" content="#1b1636">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffd27a'/%3E%3Cstop offset='1' stop-color='%23ff8fc8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%231b1636'/%3E%3Cpath d='M40 12a20 20 0 1 0 12 28A16 16 0 0 1 40 12z' fill='url(%23g)'/%3E%3Ccircle cx='46' cy='18' r='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root {
    --bg0: #141029; --bg1: #241a4a; --bg2: #3b2a5e;
    --card: rgba(255, 255, 255, 0.06); --card-hi: rgba(255, 255, 255, 0.1);
    --line: rgba(255, 226, 170, 0.22); --text: #f4effc; --dim: #b8aed4; --gold: #ffd98a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 170, 140, 0.28), transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 30%, rgba(140, 120, 255, 0.18), transparent 70%),
      linear-gradient(180deg, var(--bg2) 0%, var(--bg1) 35%, var(--bg0) 100%);
    background-attachment: fixed;
    overflow-x: hidden;
  }
  /* 星点 */
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; width: min(1180px, 100% - 32px); margin: 0 auto; }

  header { text-align: center; padding: 72px 0 44px; }
  .moon { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 50%; transform: rotate(-20deg);
    box-shadow: inset 14px -6px 0 0 #ffd88a; filter: drop-shadow(0 0 14px rgba(255, 200, 140, 0.8)) drop-shadow(0 0 30px rgba(255, 150, 190, 0.4));
    animation: float 5s ease-in-out infinite; }
  h1 { margin: 0; font-family: "ZCOOL XiaoWei", serif; font-weight: normal; font-size: clamp(38px, 6vw, 60px); letter-spacing: 0.12em;
    background: linear-gradient(90deg, #ffe7b0, #ffb8d8 60%, #c8b8ff); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255, 200, 160, 0.15); }
  h1 .nb { white-space: nowrap; display: inline-block; }
  .sub { margin: 12px 0 0; color: var(--dim); font-size: 16px; letter-spacing: 0.2em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 26px; padding-bottom: 40px; }
  .card { position: relative; display: flex; flex-direction: column; text-decoration: none; color: inherit;
    border-radius: 22px; overflow: hidden; background: var(--card); border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(10, 5, 30, 0.35); backdrop-filter: blur(6px);
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
    animation: rise 0.6s ease both; }
  .card:hover, .card:focus-visible { transform: translateY(-6px); background: var(--card-hi); border-color: var(--accent);
    box-shadow: 0 18px 44px rgba(10, 5, 30, 0.5), 0 0 0 1px var(--accent), 0 0 34px color-mix(in srgb, var(--accent) 35%, transparent); outline: none; }
  .thumb { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #2a2148; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.5s ease; }
  .card:hover .thumb img { transform: scale(1.06); }
  .thumb::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(20, 14, 40, 0.75)); }
  .badge { position: absolute; z-index: 1; top: 12px; left: 12px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: bold;
    background: rgba(20, 14, 40, 0.65); border: 1px solid rgba(255, 255, 255, 0.25); backdrop-filter: blur(4px); }
  .new { position: absolute; z-index: 1; top: 12px; right: 12px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: bold;
    color: #2a1630; background: linear-gradient(90deg, #ffe08a, #ff9fc8); }
  .body { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .title { display: flex; align-items: center; gap: 10px; }
  .title .ic { font-size: 26px; }
  .title h2 { margin: 0; font-family: "ZCOOL XiaoWei", serif; font-weight: normal; font-size: 28px; color: var(--accent); letter-spacing: 0.06em; }
  .title small { color: var(--dim); font-size: 13px; }
  .desc { margin: 0; color: #ddd4f0; font-size: 14.5px; line-height: 1.7; flex: 1; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 12px; padding: 3px 9px; border-radius: 8px; color: var(--dim); background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1); }
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 4px; }
  .device { font-size: 12.5px; color: var(--dim); }
  .play { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 999px; font-weight: bold; font-size: 14px;
    color: #241634; background: var(--accent); box-shadow: 0 4px 14px color-mix(in srgb, var(--accent) 45%, transparent); transition: gap 0.2s ease; }
  .card:hover .play { gap: 12px; }

  .archive { display: flex; align-items: center; gap: 22px; margin: 0 0 30px; padding: 18px 26px; border-radius: 22px; text-decoration: none; color: inherit;
    background: linear-gradient(100deg, rgba(232, 194, 122, 0.12), rgba(120, 80, 40, 0.10) 60%, rgba(255, 255, 255, 0.04)); border: 1px solid rgba(232, 194, 122, 0.35);
    box-shadow: 0 10px 30px rgba(10, 5, 30, 0.35); transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; animation: rise 0.6s ease both; }
  .archive:hover, .archive:focus-visible { transform: translateY(-4px); border-color: #e8c27a; box-shadow: 0 16px 40px rgba(10, 5, 30, 0.5), 0 0 30px rgba(232, 194, 122, 0.2); outline: none; }
  .archive .door { flex: 0 0 auto; width: 44px; height: 56px; border: 2px solid #e8c27a; border-bottom: none; border-radius: 22px 22px 0 0; position: relative;
    box-shadow: 0 0 16px rgba(232, 194, 122, 0.35), inset 0 0 12px rgba(232, 194, 122, 0.2); }
  .archive .door::before { content: ""; position: absolute; left: 50%; top: 16px; width: 14px; height: 14px; margin-left: -6px; border-radius: 50%; box-shadow: inset -5px 2px 0 0 #e8c27a; }
  .archive .txt { flex: 1; min-width: 0; }
  .archive h2 { margin: 0; font-family: "ZCOOL XiaoWei", serif; font-weight: normal; font-size: 26px; color: #e8c27a; letter-spacing: 0.1em; }
  .archive p { margin: 4px 0 0; color: #ddd4f0; font-size: 14px; line-height: 1.7; }
  .archive .enter { flex: 0 0 auto; padding: 9px 18px; border-radius: 999px; font-weight: bold; font-size: 14px; color: #241634; background: #e8c27a; }
  @media (max-width: 520px) { .archive { flex-wrap: wrap; padding: 16px 18px; gap: 14px; } .archive .enter { margin-left: 66px; } }

  .bgm { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; width: 42px; height: 42px; padding: 0; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; color: var(--gold); background: rgba(20, 14, 40, 0.55); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    transition: background 0.2s ease, border-color 0.2s ease, opacity 0.2s ease; }
  .bgm:hover, .bgm:focus-visible { background: rgba(60, 44, 110, 0.6); border-color: rgba(255, 217, 138, 0.5); outline: none; }
  .bgm svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bgm .slash { display: none; }
  .bgm.off { color: var(--dim); opacity: 0.7; }
  .bgm.off .slash { display: inline; }
  .bgm.playing { box-shadow: 0 0 18px rgba(255, 217, 138, 0.25); }

  footer { text-align: center; color: var(--dim); font-size: 13px; padding: 20px 0 48px; }
  footer a { color: var(--gold); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  @keyframes float { 50% { transform: rotate(-20deg) translateY(-6px); } }
  @media (max-width: 520px) {
    header { padding: 48px 0 30px; }
    .grid { grid-template-columns: 1fr; gap: 18px; }
    .sub { font-size: 14px; letter-spacing: 0.1em; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<script>
  // 想加新游戏：在这里加一项，并把 16:10 的截图放进 thumbs/
  const GAMES = [
    {
      id: 'cutie-pop', icon: '🐰', name: '萌萌消消乐', en: 'Cutie Pop', accent: '#b9a3ff', badge: '三消', isNew: true,
      desc: '拖动小萌物和旁边的交换，三个一样的连成一排就消掉。萌宠乐园和水果乐园两个世界各 30 关，连得越快萌力越高、音乐越嗨，还有中英文两套鼓励语音和 4 种救急道具。',
      tags: ['60 关', '萌力爆发', '中英文语音', '道具'], device: '📱 🖥 手机电脑都能玩',
    },
    {
      id: 'happy-link', icon: '🍓', name: '欢乐连连看', en: 'Happy Link', accent: '#ff8fb8', badge: '连连看',
      desc: '找到两个一样的图案，用不超过两个拐弯的线把它们连起来消掉。水果、萌宠、海洋、甜品、花园、星空 6 个世界 60 关，还有重力关、造型关和石头关，配上欢快的音乐。',
      tags: ['60 关', '重力关', '连击加分', '欢快音乐'], device: '📱 🖥 手机电脑都能玩',
    },
    {
      id: 'little-glade', icon: '🏰', name: '小小林间', en: 'Little Glade', accent: '#a9c86a', badge: '3D 建造',
      desc: '没有网格，随手拖拽：画一道城墙就长出石砌塔楼，拉一下就盖起小屋。铺碎石小路、涂抹池塘放锦鲤，种下糖枫、白桦和巨杉，再看它们随四季和晴雨雷雪变换模样。',
      tags: ['自由建造', '北美树种', '四季天气', '池塘与鱼'], device: '🖥 电脑 · 鼠标拖拽',
    },
    {
      id: 'polar-roadtrip', icon: '🐻‍❄️', name: '北极熊房车记', en: 'Polar Road Trip', accent: '#ffb88a', badge: '3D 公路旅行',
      desc: '背着小背包的北极熊开着房车横穿美国。在真实地形的立体地图上规划路线，算好燃料、天数和体温，开上 3D 公路接冰淇淋降温，停靠路边小店，集齐各州邮戳。',
      tags: ['真实美国地形', '3D 公路驾驶', '各州邮戳', '旅行手账'], device: '📱 🖥 手机电脑都能玩',
    },
    {
      id: 'stargazer-fund', icon: '📈', name: '观星者基金', en: 'Stargazer Fund', accent: '#8fc8ff', badge: 'AI 模拟炒股',
      desc: '一位 AI 基金经理，用 100 万美元模拟交易美股。每个交易日观察行情、阅读新闻、决定买卖，并公开它的思考。看看它能不能跑赢标普 500。',
      tags: ['真实美股行情', '每日交易日志', '对比标普500'], device: '📱 🖥 手机电脑都能看',
    },
    {
      id: 'star-weaver', icon: '✨', name: '织星', en: 'Star Weaver', accent: '#ffd98a', badge: '一笔画解谜',
      desc: '以星光为线，一笔连起整片夜空。四季 32 个星座，鹊桥要走两次、流星只能顺着飞、星门带你穿越夜空，每一笔都会奏出一个音符。',
      tags: ['一笔画', '四季星座', '32 关', '钢琴音效'], device: '📱 🖥 手机电脑都能玩',
    },
    {
      id: 'starleaf-wardens', icon: '🌙', name: '星叶守望', en: 'Starleaf Wardens', accent: '#c9b4ff', badge: '3D 塔防',
      desc: '以大地为棋，以高地为剑。抬高地形、规划敌人路线、在高地上建塔，和月之仙子露娜一起守护月光古树。每一波还有变幻的天象。',
      tags: ['地形塔防', '三张地图', '天象系统', '英雄技能'], device: '🖥 电脑 · 鼠标键盘',
    },
    {
      id: 'penguin-run', icon: '🐧', name: '企鹅跑酷', en: 'Penguin Run', accent: '#ffb37a', badge: '3D 跑酷',
      desc: '围着红围巾的小企鹅，沿着夕阳下的雪色海岸一路狂奔。换道、跳跃、肚皮滑行，躲开障碍，收集金币。',
      tags: ['无尽跑酷', '夕阳海岸', '金币收集'], device: '🖥 📱 键盘或滑屏',
    },
    {
      id: 'moon-english', icon: '🔤', name: 'Moon英语', en: 'Moon English', accent: '#8fe36a', badge: '儿童英语',
      desc: '给小朋友的看图听音英语练习，像闯关一样一课一课往前走，难度参照 RAZ 分级（AA → J）。学一学、听一听、看一看、小测验。',
      tags: ['看图听音', 'RAZ AA–J', '闯关学习'], device: '📱 🖥 手机平板电脑',
    },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = GAMES.map((g, i) => `
    <a class="card" href="https://hitanorain.github.io/${g.id}/" style="--accent:${g.accent};animation-delay:${0.08 + i * 0.1}s" aria-label="${g.name}">
      <div class="thumb">
        <img src="thumbs/${g.id}.jpg" alt="${g.name} 截图" loading="${i < 3 ? 'eager' : 'lazy'}" onerror="this.remove()">
        <span class="badge">${g.badge}</span>
        ${g.isNew ? '<span class="new">最近更新</span>' : ''}
      </div>
      <div class="body">
        <div class="title"><span class="ic">${g.icon}</span><h2>${g.name}</h2><small>${g.en}</small></div>
        <p class="desc">${g.desc}</p>
        <div class="tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        <div class="foot"><span class="device">${g.device}</span><span class="play">开始玩 <span aria-hidden="true">→</span></span></div>
      </div>
    </a>`).join('');

  // 背景里缓缓闪烁的星点
  const cv = document.getElementById('stars'), cx = cv.getContext('2d');
  let stars = [];
  function resize() {
    const d = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * d; cv.height = innerHeight * d; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    cx.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 9000) }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight * 0.75, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6, s: 0.5 + Math.random() * 1.5,
    }));
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(t) {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p));
      cx.fillStyle = `rgba(255, 244, 220, ${a * (1 - s.y / innerHeight)})`;
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI * 2); cx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener('resize', () => { resize(); if (still) draw(0); });
  resize();
  requestAnimationFrame(draw);

  // 背景音乐：Web Audio 实时合成（柔和的和弦铺底 + 八音盒），不用音频文件。
  // 浏览器不让自动播放，所以第一次点击/按键后才开始；右上角按钮开关，状态记在 localStorage。
  (() => {
    const KEY = 'hub-bgm', btn = document.getElementById('bgm');
    let on = true;
    try { on = localStorage.getItem(KEY) !== 'off'; } catch (e) {}
    let ac = null, bus, master, timer = 0, step = 0, nextT = 0, stopTimer = 0;
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);
    const BEAT = 60 / 66;
    // 四小节循环：Dmaj9 – Bm9 – Gmaj9 – A6sus（低音, 和弦音…, 高音区用来写八音盒旋律）
    const CHORDS = [
      [38, [57, 61, 64, 66], [69, 73, 76, 78, 81]],
      [35, [54, 57, 61, 62], [66, 69, 73, 74, 78]],
      [31, [54, 57, 59, 62], [66, 69, 71, 74, 78]],
      [33, [52, 57, 59, 62], [64, 69, 71, 74, 76]],
    ];
    const PATTERN = [1, 0, 0.6, 0.5, 0.9, 0, 0.5, 0.3]; // 每个八分音符出声的概率

    function setup() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      ac = new AC();
      master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
      // 用衰减噪声生成混响的脉冲响应
      const len = Math.floor(ac.sampleRate * 3.2), ir = ac.createBuffer(2, len, ac.sampleRate);
      for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
      const verb = ac.createConvolver(); verb.buffer = ir;
      const wet = ac.createGain(); wet.gain.value = 0.6;
      bus = ac.createGain();
      bus.connect(lp); lp.connect(master); lp.connect(verb); verb.connect(wet); wet.connect(master);
      return true;
    }
    function pad(m, t, dur, vol) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 1.6);
      g.gain.setValueAtTime(vol, t + dur - 0.4);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 1.8);
      g.connect(bus);
      for (const det of [-6, 6]) {
        const o = ac.createOscillator(); o.type = 'triangle'; o.frequency.value = hz(m); o.detune.value = det;
        o.connect(g); o.start(t); o.stop(t + dur + 2);
      }
    }
    function bell(m, t, vol) {
      const g = ac.createGain();
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.6);
      g.connect(bus);
      [[1, 1], [2, 0.18], [3.01, 0.06]].forEach(([k, a]) => {
        const o = ac.createOscillator(), og = ac.createGain();
        o.type = 'sine'; o.frequency.value = hz(m) * k; og.gain.value = a;
        o.connect(og); og.connect(g); o.start(t); o.stop(t + 2.7);
      });
    }
    let last = 2;
    function schedule() {
      while (nextT < ac.currentTime + 0.5) {
        const [bass, mid, top] = CHORDS[Math.floor(step / 8) % 4], s = step % 8, t = nextT;
        if (s === 0) {
          pad(bass, t, BEAT * 4, 0.05);
          mid.forEach(m => pad(m, t, BEAT * 4, 0.022));
        }
        if (Math.random() < PATTERN[s]) {
          // 旋律多走级进，偶尔跳一下
          last = Math.max(0, Math.min(top.length - 1, last + (Math.random() < 0.75 ? (Math.random() < 0.5 ? -1 : 1) : (Math.random() < 0.5 ? -2 : 2))));
          bell(top[last], t + (Math.random() - 0.5) * 0.02, s === 0 ? 0.075 : 0.055);
        }
        step++; nextT += BEAT / 2;
      }
    }
    function start() {
      if (!ac && !setup()) return;
      clearTimeout(stopTimer);
      ac.resume();
      if (!timer) { nextT = ac.currentTime + 0.1; timer = setInterval(schedule, 150); schedule(); }
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.setValueAtTime(master.gain.value, ac.currentTime);
      master.gain.linearRampToValueAtTime(0.9, ac.currentTime + 2.5);
      btn.classList.add('playing');
    }
    function stop() {
      btn.classList.remove('playing');
      if (!ac) return;
      master.gain.cancelScheduledValues(ac.currentTime);
      master.gain.setValueAtTime(master.gain.value, ac.currentTime);
      master.gain.linearRampToValueAtTime(0, ac.currentTime + 0.6);
      clearTimeout(stopTimer);
      stopTimer = setTimeout(() => { clearInterval(timer); timer = 0; ac.suspend(); }, 700);
    }
    function paint() {
      btn.classList.toggle('off', !on);
      btn.setAttribute('aria-pressed', String(on));
      btn.title = '背景音乐：' + (on ? '开' : '关');
    }
    btn.addEventListener('click', () => {
      on = !on;
      try { localStorage.setItem(KEY, on ? 'on' : 'off'); } catch (e) {}
      paint();
      on ? start() : stop();
    });
    // 第一次和页面交互时开始播放（点音乐按钮本身交给上面的开关处理）
    const kick = e => {
      if (e.target.closest && e.target.closest('#bgm')) return;
      ['pointerdown', 'keydown', 'touchend'].forEach(t => removeEventListener(t, kick, true));
      if (on) start();
    };
    ['pointerdown', 'keydown', 'touchend'].forEach(t => addEventListener(t, kick, true));
    // 切到别的标签页时暂停，回来再接着放
    document.addEventListener('visibilitychange', () => {
      if (!ac || !on || !btn.classList.contains('playing')) return;
      if (document.hidden) { clearInterval(timer); timer = 0; ac.suspend(); }
      else { ac.resume(); nextT = ac.currentTime + 0.1; timer = setInterval(schedule, 150); }
    });
    paint();
  })();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>天外来客</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;600;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#efe9df;--dim:rgba(239,233,223,.58);--alert:#ff7457;--warm:#ffc890;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--fg:#efe9df}}
:root[data-theme="dark"]{--bg:#000;--fg:#efe9df}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.ui{position:fixed;left:0;right:0;pointer-events:none}
#hud{top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;justify-content:space-between;gap:12px;padding:0 20px;
  font-size:13px;letter-spacing:.14em;color:var(--dim);font-variant-numeric:tabular-nums;opacity:0;transition:opacity 1s,color .6s}
#hud.on{opacity:1}
#hud.alert{color:var(--alert)}
#cap{bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);text-align:center;padding:0 26px;opacity:0;transform:translateY(8px);
  transition:opacity 1s ease,transform 1s ease}
#cap.show{opacity:1;transform:none}
#chap{font-size:13px;letter-spacing:.6em;color:var(--warm);margin-bottom:14px;font-weight:600;padding-left:.6em}
#line{font-size:clamp(17px,2.4vw,25px);font-weight:300;letter-spacing:.14em;line-height:1.75;
  text-shadow:0 2px 18px #000,0 0 6px #000;max-width:30em;margin:0 auto}
#years{top:calc(env(safe-area-inset-top,0px) + 12vh);text-align:center;opacity:0;transition:opacity 1.4s}
#years.on{opacity:1}
#years small{display:block;font-size:13px;letter-spacing:.5em;color:var(--dim);margin-bottom:10px;padding-left:.5em}
#years b{font-size:clamp(30px,6vw,56px);font-weight:900;letter-spacing:.04em;font-variant-numeric:tabular-nums;text-shadow:0 0 30px rgba(0,0,0,.8)}
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px;background:radial-gradient(ellipse at center,rgba(0,0,0,.2),rgba(0,0,0,.85));transition:opacity 1.6s}
.overlay.hide{opacity:0;pointer-events:none}
.title{font-size:clamp(46px,11vw,96px);font-weight:900;letter-spacing:.32em;margin:0;padding-left:.32em;line-height:1.1;
  background:linear-gradient(180deg,#fffaf2 10%,#ffd6a6 55%,#ff8a52);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 24px rgba(255,140,70,.35))}
.sub{margin:22px 0 46px;font-weight:300;letter-spacing:.32em;padding-left:.32em;color:var(--dim);font-size:15px;line-height:1.9}
button.go{pointer-events:auto;font:inherit;font-weight:600;font-size:16px;letter-spacing:.42em;padding:15px 34px 15px 42px;color:#2a1305;
  background:linear-gradient(180deg,#ffe7c8,#ffad6e);border:0;border-radius:999px;cursor:pointer;box-shadow:0 0 44px rgba(255,150,80,.4)}
button.go:disabled{opacity:.45;cursor:default;box-shadow:none}
button.go:focus-visible,#mute:focus-visible{outline:2px solid #fff;outline-offset:4px}
.note{margin-top:26px;font-size:12px;letter-spacing:.18em;color:rgba(239,233,223,.42);line-height:2.1}
#mute{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:40px;height:40px;border-radius:50%;
  border:1px solid rgba(239,233,223,.25);background:rgba(0,0,0,.35);color:var(--dim);font-size:16px;cursor:pointer;display:none}
#mute.on{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="ui"><span id="hudL"></span><span id="hudR"></span></div>
<div id="years" class="ui"><small>撞击之后</small><b id="yearsN"></b></div>
<div id="cap" class="ui"><div id="chap"></div><div id="line"></div></div>
<button id="mute" aria-label="静音">♪</button>
<div id="intro" class="overlay">
  <h1 class="title">天外来客</h1>
  <p class="sub">一颗彗星与一颗星球的相遇</p>
  <button class="go" id="go" disabled>正在生成星球</button>
  <p class="note">全程约三分钟，建议戴上耳机、横屏观看<br>iPhone 若无声音，请关闭侧边静音键</p>
</div>
<div id="end" class="overlay hide">
  <h2 class="title" style="font-size:clamp(34px,7vw,64px)">生生不息</h2>
  <p class="sub">伤痕会淡去，生命会回来</p>
  <button class="go" id="again">重新播放</button>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,GA=1;
const PI=Math.PI,TAU=PI*2;
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const ss=(a,b,x)=>{x=clamp((x-a)/(b-a),0,1);return x*x*(3-2*x)};
const ease=x=>ss(0,1,x);
const lerp=(a,b,t)=>a+(b-a)*t;
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const len=a=>Math.hypot(a[0],a[1],a[2]),nrm=a=>{const l=len(a)||1;return[a[0]/l,a[1]/l,a[2]/l]};
const lv=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const Y=[0,1,0],O=[0,0,0];
const sph=(az,el)=>[Math.cos(el)*Math.cos(az),Math.sin(el),Math.cos(el)*Math.sin(az)];
function hsh(n,s){let h=Math.imul(n|0,374761393)^Math.imul(s|0,668265263);h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
const gauss=()=>(Math.random()+Math.random()+Math.random()+Math.random()-2)*1.732;

/* ---------- timeline ---------- */
const TI=100,TEND=178;

/* ---------- noise ---------- */
function hash3(x,y,z,s){let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(z,1274126177)^Math.imul(s,1442695041);
  h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y,z,s){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z);const xf=x-xi,yf=y-yi,zf=z-zi;
  const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf),w=zf*zf*(3-2*zf);
  const a=hash3(xi,yi,zi,s),b=hash3(xi+1,yi,zi,s),c=hash3(xi,yi+1,zi,s),d=hash3(xi+1,yi+1,zi,s),
        e=hash3(xi,yi,zi+1,s),f=hash3(xi+1,yi,zi+1,s),g=hash3(xi,yi+1,zi+1,s),h=hash3(xi+1,yi+1,zi+1,s);
  const x00=a+(b-a)*u,x10=c+(d-c)*u,x01=e+(f-e)*u,x11=g+(h-g)*u;const y0=x00+(x10-x00)*v,y1=x01+(x11-x01)*v;return y0+(y1-y0)*w}
function fbm(x,y,z,s,o){let a=.5,f=1,sum=0,n=0;for(let i=0;i<o;i++){sum+=a*vnoise(x*f,y*f,z*f,s+i*17);n+=a;a*=.5;f*=2.03}return sum/n}

/* ---------- earth texture ---------- */
const TW=1024,TH=512,NT=TW*TH;
const GLD=new Uint8Array(NT*4);let SEAN=.5;const BR=new Uint8ClampedArray(NT),BG=new Uint8ClampedArray(NT),BB=new Uint8ClampedArray(NT),LAND=new Uint8Array(NT),
      MO=new Float32Array(NT),CL=new Float32Array(NT),CITY=new Float32Array(NT),HH=new Float32Array(NT);
function texRow(j){const lat=(.5-(j+.5)/TH)*PI,cl=Math.cos(lat),sl=Math.sin(lat);
  for(let i=0;i<TW;i++){const lon=(i+.5)/TW*TAU-PI,X=cl*Math.sin(lon),Yy=sl,Z=cl*Math.cos(lon),t=j*TW+i;
    const wx=fbm(X*1.2+3,Yy*1.2,Z*1.2,7,2)-.5;
    HH[t]=fbm(X*1.7+wx*1.5,Yy*1.7+wx,Z*1.7-wx,1,6);
    MO[t]=fbm(X*2.4+9,Yy*2.4,Z*2.4,3,3);
    CL[t]=fbm(X*3+wx*2,Yy*5.5,Z*3,11,4);
    CITY[t]=vnoise(X*70,Yy*70,Z*70,31)*vnoise(X*9,Yy*9,Z*9,41);}}
function pct(arr,p){const s=Float32Array.from(arr).sort();return s[Math.floor(s.length*p)]}
function texFinish(){
  const sea=pct(HH,.63),top=pct(HH,.995),bot=pct(HH,.01),m30=pct(MO,.3),m70=pct(MO,.72),c1=pct(CL,.58),c2=pct(CL,.95),ct=pct(CITY,.93);
  for(let j=0;j<TH;j++){const al=Math.abs((.5-(j+.5)/TH)*PI);
    for(let i=0;i<TW;i++){const t=j*TW+i,h=HH[t];let r,g,b,dry=0;
      if(h<sea){const d=clamp((sea-h)/(sea-bot),0,1),sh=ss(.12,0,d);r=lerp(22,4,d)+16*sh;g=lerp(78,22,d)+30*sh;b=lerp(130,62,d)+18*sh;LAND[t]=0}
      else{LAND[t]=1;const e=clamp((h-sea)/(top-sea),0,1);dry=ss(m70,m30,MO[t]);
        r=lerp(36,170,dry);g=lerp(74,144,dry);b=lerp(34,100,dry);
        const mt=ss(.45,.9,e);r=lerp(r,126,mt);g=lerp(g,116,mt);b=lerp(b,106,mt);
        if(al>1.06||(al>.88&&e>.5)){r=232;g=238;b=244;LAND[t]=2}}
      if(al>1.24){r=228;g=235;b=243;LAND[t]=2}
      BR[t]=r;BG[t]=g;BB[t]=b;CL[t]=ss(c1,c2,CL[t]);
      CITY[t]=(LAND[t]===1&&dry<.75&&al<1)?ss(ct,ct*1.25,CITY[t]):0;
      const q=t*4;GLD[q]=clamp((h-bot)/(top-bot),0,1)*255;GLD[q+1]=(h<sea?ss(m70,m30,MO[t]):dry)*255;GLD[q+2]=CL[t]*255;GLD[q+3]=CITY[t]*255;}}
  SEAN=(sea-bot)/(top-bot);if(GL)uploadTex();
}

/* ---------- world ---------- */
const ER=10,OM=.012,TH0=PI/2-OM*TI,RE=.35;
const earthAt=T=>{const a=TH0+OM*T;return[ER*Math.cos(a),0,ER*Math.sin(a)]};
const tanAt=T=>{const a=TH0+OM*T;return[-Math.sin(a),0,Math.cos(a)]};
const dApp=T=>{const e=nrm(earthAt(T)),t=tanAt(T);return nrm(add(add(mul(e,-.72),mul(Y,.4)),mul(t,.58)))};
const PLAN=[{r:4,s:.16,c:[179,172,162],p:1.2},{r:7,s:.3,c:[233,207,149],p:4},{r:ER,s:RE,c:null,p:0},{r:14,s:.22,c:[208,106,64],p:2.2},
  {r:22,s:1,c:[220,183,143],p:3.4},{r:30,s:.85,c:[230,210,158],p:5.6,ring:1},{r:38,s:.5,c:[160,215,225],p:.7},{r:45,s:.48,c:[90,130,230],p:2.9}];
const pOm=r=>OM*Math.pow(ER/r,1.5);
const planetAt=(p,T)=>{if(!p.c)return earthAt(T);const a=p.p+pOm(p.r)*T;return[p.r*Math.cos(a),p.r*.012*Math.sin(a*1.7),p.r*Math.sin(a)]};
const moonAng=T=>2.3+.05*T+(T>141?.0035*(T-141)*(T-141):0);
const moonAt=T=>{const a=moonAng(T),E=earthAt(T);return[E[0]+1.6*Math.cos(a),.14*Math.sin(a),E[2]+1.6*Math.sin(a)]};

/* earth spin & body frame */
const TILT=.41,cT=Math.cos(TILT),sT=Math.sin(TILT);
let SPINX=TAU*2;
const rot=T=>.3+.02*T+SPINX*ss(141,165,T);
function toBody(n,T){const x1=n[0],y1=n[1]*cT+n[2]*sT,z1=-n[1]*sT+n[2]*cT;const r=rot(T),c=Math.cos(r),s=Math.sin(r);return[x1*c-z1*s,y1,x1*s+z1*c]}
function toWorld(b,T){const r=rot(T),c=Math.cos(r),s=Math.sin(r);const x1=b[0]*c+b[2]*s,z1=-b[0]*s+b[2]*c,y1=b[1];return[x1,y1*cT-z1*sT,y1*sT+z1*cT]}
const IMPB=toBody(dApp(TI),TI);
(()=>{let best=-9,bx=SPINX;for(let k=TAU*1.2;k<TAU*2.6;k+=.01){SPINX=k;const n=toWorld(IMPB,170),L=nrm(mul(earthAt(170),-1));const v=dot(n,L)+.25*n[1];if(v>best){best=v;bx=k}}SPINX=bx})();
const siteN=T=>toWorld(IMPB,T);

/* comet path */
const P0=[-30,18,-46],A1=[-16,10,-26],A2=[-8,2.2,-8.6],Q=[-3.2,.6,-3.4];
const D1=6.5,S70=add(earthAt(70),mul(dApp(70),D1));
const B1=add(Q,mul(nrm(sub(Q,A2)),5.5)),B2=add(S70,mul(dApp(70),4.5));
const cubic=(a,b,c,d,t)=>{const u=1-t,k0=u*u*u,k1=3*u*u*t,k2=3*u*t*t,k3=t*t*t;return[a[0]*k0+b[0]*k1+c[0]*k2+d[0]*k3,a[1]*k0+b[1]*k1+c[1]*k2+d[1]*k3,a[2]*k0+b[2]*k1+c[2]*k2+d[2]*k3]};
function cometAt(T){
  if(T<34)return P0.slice();
  if(T<52){const x=(T-34)/18;return cubic(P0,A1,A2,Q,Math.pow(x,1.4))}
  if(T<70){const x=(T-52)/18;return cubic(Q,B1,B2,S70,x*(1.3-.3*x))}
  const u=clamp((T-70)/(TI-70),0,1),d=RE+(D1-RE)*(1-Math.pow(u,1.6));return add(earthAt(T),mul(dApp(T),d))}
const velAt=T=>mul(sub(cometAt(T+.05),cometAt(T-.05)),10);
const actAt=C=>clamp(9/(len(C)+1),.35,2.1);
function tailDir(T,C){const as=nrm(C);const k=.85*ss(70,86,T);if(k<=0)return as;return nrm(lv(as,nrm(mul(velAt(T),-1)),k))}

/* impact state with slow motion */
const tauI=T=>T<TI?-1:(T<106?(T-TI)*.5:3+(T-106));
function stateAt(T){const t=tauI(T),imp=t>=0;return{imp,t,
  heat:imp?Math.exp(-t/9):0,fireR:imp?1.75*ss(0,16,t):0,fireI:imp?1-ss(12,26,t):0,
  burn:imp?ss(.3,16,t)*(1-ss(45,62,t)):0,dust:imp?.88*ss(4,18,t)*(1-ss(40,56,t)):0,
  scar:imp?ss(50,70,t):0,city:imp?1-ss(0,5,t):1}}

/* ---------- camera ---------- */
function makeCam(pos,target,up,fov){const f=nrm(sub(target,pos));let r=cross(f,up||Y);if(len(r)<1e-4)r=cross(f,[1,0,0]);r=nrm(r);const u=cross(r,f);
  return{pos,fwd:f,right:r,up:u,f:(Math.min(W,H)/2)/Math.tan(fov*PI/360)}}
function project(c,p){const vx=p[0]-c.pos[0],vy=p[1]-c.pos[1],vz=p[2]-c.pos[2];const z=vx*c.fwd[0]+vy*c.fwd[1]+vz*c.fwd[2];if(z<.005)return null;
  return[(vx*c.right[0]+vy*c.right[1]+vz*c.right[2])/z*c.f+W/2,-(vx*c.up[0]+vy*c.up[1]+vz*c.up[2])/z*c.f+H/2,z]}
function projDir(c,d){const z=dot(d,c.fwd);if(z<.01)return null;return[dot(d,c.right)/z*c.f+W/2,-dot(d,c.up)/z*c.f+H/2]}
function localFrame(n){let t1=cross(n,Y);if(len(t1)<1e-3)t1=[1,0,0];t1=nrm(t1);return[t1,cross(t1,n)]}
function rotAxis(v,k,a){const c=Math.cos(a),s=Math.sin(a);return add(add(mul(v,c),mul(cross(k,v),s)),mul(k,dot(k,v)*(1-c)))}

/* galaxy */
const GB=[[],[],[],[],[]],GGL=[],GDU=[];let sunG=[0,0,0];
const armTh=(r,off)=>Math.log(r/30)/.24+off;
function genGalaxy(){const n=32000;const offs=[0,PI,PI/2,3*PI/2];
  for(let i=0;i<n;i++){const k=Math.random();
    if(k<.16){const r=Math.abs(gauss())*85,a=Math.random()*TAU;GB[0].push([r*Math.cos(a),gauss()*r*.45,r*Math.sin(a)]);continue}
    const ai=Math.random()<.75?(Math.random()<.5?0:1):(Math.random()<.5?2:3);const r=60+(-Math.log(Math.random()))*240;if(r>1050)continue;
    const inter=Math.random()<.35,sc=inter?gauss()*.9:gauss()*.16,th=armTh(r,offs[ai])+sc;
    const p=[r*Math.cos(th),gauss()*(9+r*.012),r*Math.sin(th)];
    GB[inter?2:(Math.random()<.05?3:(Math.random()<.1?4:1))].push(p)}
  for(let i=0;i<600;i++){const ai=i%4,r=80+Math.random()*850,th=armTh(r,offs[ai])+gauss()*.1;GGL.push({p:[r*Math.cos(th),0,r*Math.sin(th)],r:45+Math.random()*75,pk:Math.random()<.14})}
  for(let i=0;i<300;i++){const ai=i%2,r=110+Math.random()*700,th=armTh(r,offs[ai])-.17+gauss()*.04;GDU.push({p:[r*Math.cos(th),0,r*Math.sin(th)],r:22+Math.random()*34})}
  const rS=560,thS=armTh(rS,0)+.06;sunG=[rS*Math.cos(thS),0,rS*Math.sin(thS)];
  for(let i=0;i<3000;i++)GB[4].push(add(sunG,[gauss()*55,gauss()*30,gauss()*55]));
}
function galCam(T){const az=lerp(-.9,.55,ease(T/19.5)),el=lerp(1.0,.32,ease(T/18));
  let tgt=lv(O,sunG,ease((T-5)/9)*.85),dist;
  if(T<12.5)dist=lerp(2700,1150,ease(T/12.5));else{const k=ease((T-12.5)/6.8);dist=1150*Math.pow(30/1150,k);tgt=lv(tgt,sunG,ease((T-12.5)/3))}
  return makeCam(add(tgt,mul(sph(az,el),dist)),tgt,Y,55)}

/* ---------- sprites ---------- */
function mkSpr(st){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d'),gr=g.createRadialGradient(32,32,0,32,32,32);st.forEach(s=>gr.addColorStop(s[0],s[1]));g.fillStyle=gr;g.fillRect(0,0,64,64);return c}
const SPR={
  w:mkSpr([[0,'rgba(255,255,255,1)'],[.22,'rgba(255,255,255,.5)'],[.55,'rgba(255,255,255,.12)'],[1,'rgba(255,255,255,0)']]),
  b:mkSpr([[0,'rgba(180,220,255,1)'],[.3,'rgba(110,170,255,.42)'],[1,'rgba(60,110,255,0)']]),
  y:mkSpr([[0,'rgba(255,246,225,1)'],[.3,'rgba(255,226,175,.42)'],[1,'rgba(255,200,140,0)']]),
  o:mkSpr([[0,'rgba(255,242,205,1)'],[.2,'rgba(255,170,80,.75)'],[.55,'rgba(255,90,30,.22)'],[1,'rgba(200,40,10,0)']]),
  r:mkSpr([[0,'rgba(255,120,60,.9)'],[.4,'rgba(200,50,20,.35)'],[1,'rgba(120,20,10,0)']]),
  k:mkSpr([[0,'rgba(84,54,38,.8)'],[.5,'rgba(70,46,34,.35)'],[1,'rgba(60,40,30,0)']]),
  p:mkSpr([[0,'rgba(255,150,200,.9)'],[.4,'rgba(220,100,170,.3)'],[1,'rgba(150,60,140,0)']]),
  g:mkSpr([[0,'rgba(150,175,255,.8)'],[.5,'rgba(110,130,230,.25)'],[1,'rgba(80,90,200,0)']]),
  c:mkSpr([[0,'rgba(255,225,170,1)'],[.25,'rgba(255,200,130,.5)'],[1,'rgba(255,170,100,0)']]),
  s:mkSpr([[0,'rgba(255,253,242,1)'],[.12,'rgba(255,238,175,.92)'],[.3,'rgba(255,182,85,.36)'],[.65,'rgba(255,120,40,.08)'],[1,'rgba(255,100,30,0)']])};
function spr(s,x,y,r,a){if(a<=.003||r<.25)return;if(x+r<0||x-r>W||y+r<0||y-r>H)return;ctx.globalAlpha=Math.min(1,a)*GA;ctx.drawImage(s,x-r,y-r,2*r,2*r)}

/* ---------- sky ---------- */

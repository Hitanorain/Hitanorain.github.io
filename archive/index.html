<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星叶档案馆</title>
<meta name="description" content="星叶宇宙的故事书架：总纲、正传、外传与番外。">
<meta name="theme-color" content="#120d1c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23120d1c'/%3E%3Cpath d='M18 54V28a14 14 0 0 1 28 0v26z' fill='none' stroke='%23e8c27a' stroke-width='4'/%3E%3Cpath d='M36 22a8 8 0 1 0 4 12 6 6 0 0 1-4-12z' fill='%23e8c27a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #120d1c; --dusk: #1d1530; --wood: #3b2516; --wood-hi: #5b3a20; --wood-lo: #24160c;
    --gold: #e8c27a; --gold-dim: rgba(232, 194, 122, 0.35); --parch: #eadfc6; --dim: #a8987c; --ink: #17110b;
    --seal: #8e2a2a;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh; color: var(--parch); overflow-x: hidden;
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    background:
      radial-gradient(ellipse 70% 40% at 50% 0%, rgba(120, 90, 200, 0.25), transparent 70%),
      radial-gradient(ellipse 40% 30% at 12% 70%, rgba(255, 170, 80, 0.10), transparent 70%),
      radial-gradient(ellipse 40% 30% at 88% 75%, rgba(255, 170, 80, 0.10), transparent 70%),
      linear-gradient(180deg, var(--night) 0%, var(--dusk) 30%, #1c130d 75%, #140d08 100%);
    background-attachment: fixed;
  }
  #stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  #app { position: relative; z-index: 1; }
  a { color: inherit; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .wrap { width: min(1100px, 100% - 32px); margin: 0 auto; }
  .back { display: inline-flex; align-items: center; gap: 6px; padding: 18px 0 0; color: var(--dim); text-decoration: none; font-size: 14px; letter-spacing: 0.08em; }
  .back:hover { color: var(--gold); }
  .t { font-family: "ZCOOL XiaoWei", serif; font-weight: normal; }

  /* ---------- 大厅 ---------- */
  .hall-head { text-align: center; padding: 34px 0 30px; }
  .door { width: 74px; height: 92px; margin: 0 auto 18px; position: relative; border: 3px solid var(--gold); border-bottom: none;
    border-radius: 37px 37px 0 0; box-shadow: 0 0 24px rgba(232, 194, 122, 0.35), inset 0 0 18px rgba(232, 194, 122, 0.2); }
  .door::before { content: ""; position: absolute; left: 50%; top: 26px; width: 24px; height: 24px; margin-left: -10px; border-radius: 50%;
    box-shadow: inset -8px 3px 0 0 var(--gold); transform: rotate(-20deg); filter: drop-shadow(0 0 8px rgba(255, 210, 140, 0.8)); }
  .door::after { content: ""; position: absolute; left: -14px; right: -14px; bottom: 0; height: 3px; background: var(--gold); border-radius: 2px; }
  .hall-head h1 { margin: 0; font-size: clamp(38px, 6vw, 58px); letter-spacing: 0.18em; color: var(--gold); text-shadow: 0 0 26px rgba(232, 194, 122, 0.3); }
  .hall-head .sub { margin: 12px 0 0; color: var(--dim); letter-spacing: 0.16em; font-size: 15px; }
  .rules { max-width: 560px; margin: 26px auto 0; padding: 14px 22px; font-size: 14px; line-height: 1.9; color: #cbbd9f; text-align: center;
    border-top: 1px solid var(--gold-dim); border-bottom: 1px solid var(--gold-dim); }

  .lectern { display: grid; grid-template-columns: 180px 1fr; gap: 26px; align-items: center; margin: 10px auto 46px; max-width: 760px; padding: 22px 26px;
    border-radius: 18px; background: linear-gradient(180deg, rgba(255, 230, 180, 0.07), rgba(255, 230, 180, 0.02)); border: 1px solid var(--gold-dim);
    text-decoration: none; transition: border-color 0.25s, transform 0.25s, box-shadow 0.25s; }
  .lectern:hover, .lectern:focus-visible { border-color: var(--gold); transform: translateY(-3px); box-shadow: 0 0 40px rgba(232, 194, 122, 0.18); outline: none; }
  .open-book { position: relative; height: 112px; perspective: 400px; }
  .open-book .pg { position: absolute; top: 0; width: 50%; height: 100%; background: linear-gradient(90deg, #e9dcbc, #d8c79f); border: 1px solid #b29b6c; }
  .open-book .pg.l { left: 0; border-radius: 6px 0 0 6px; transform: rotateY(12deg); transform-origin: right; box-shadow: inset -10px 0 14px rgba(0,0,0,0.25); }
  .open-book .pg.r { right: 0; border-radius: 0 6px 6px 0; transform: rotateY(-12deg); transform-origin: left; box-shadow: inset 10px 0 14px rgba(0,0,0,0.25); }
  .open-book .pg::before { content: ""; position: absolute; inset: 18px 14px; background: repeating-linear-gradient(180deg, rgba(80, 55, 25, 0.35) 0 1px, transparent 1px 9px); }
  .open-book .glow { position: absolute; left: 50%; top: -18px; width: 120px; height: 60px; margin-left: -60px; border-radius: 50%;
    background: radial-gradient(rgba(255, 220, 150, 0.45), transparent 70%); animation: breathe 4s ease-in-out infinite; }
  .lectern .no { font-size: 12px; letter-spacing: 0.2em; color: var(--dim); }
  .lectern h2 { margin: 4px 0 8px; font-size: 30px; color: var(--gold); letter-spacing: 0.1em; }
  .lectern p { margin: 0; font-size: 14px; line-height: 1.9; color: #d3c5a6; }
  .lectern .go { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--gold); letter-spacing: 0.1em; }

  .shelf-sec { margin: 0 0 44px; }
  .plaque { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; margin: 0 0 12px; padding-left: 6px; }
  .plaque h3 { margin: 0; font-size: 26px; color: var(--gold); letter-spacing: 0.12em; }
  .plaque .s { font-size: 13px; padding: 2px 10px; border: 1px solid var(--gold-dim); border-radius: 999px; color: var(--gold); }
  .plaque p { margin: 0; color: var(--dim); font-size: 14px; }
  .case { position: relative; padding: 26px 22px 0; border-radius: 14px 14px 6px 6px;
    background: linear-gradient(180deg, rgba(10, 6, 3, 0.75), rgba(30, 18, 9, 0.55)); border: 1px solid rgba(120, 80, 40, 0.5);
    box-shadow: inset 0 18px 30px rgba(0, 0, 0, 0.6); }
  .row { display: flex; align-items: flex-end; gap: 10px; min-height: 250px; overflow-x: auto; overflow-y: hidden; padding: 20px 4px 0; scrollbar-width: thin; }
  .plank { height: 18px; margin: 0 -22px; border-radius: 3px; background: linear-gradient(180deg, var(--wood-hi), var(--wood) 55%, var(--wood-lo));
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.55); }

  .spine { flex: 0 0 auto; position: relative; width: 62px; border: none; padding: 0; border-radius: 4px 4px 2px 2px;
    background: linear-gradient(90deg, rgba(0,0,0,0.35), rgba(255,255,255,0.12) 30%, rgba(0,0,0,0.05) 60%, rgba(0,0,0,0.4)), var(--c);
    box-shadow: 2px 0 6px rgba(0, 0, 0, 0.5); transition: transform 0.25s ease, box-shadow 0.25s ease; text-decoration: none; }
  .spine::before, .spine::after { content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--gold); opacity: 0.8; box-shadow: 0 5px 0 var(--gold); }
  .spine::before { top: 12px; } .spine::after { bottom: 34px; }
  .spine .nm { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); writing-mode: vertical-rl; font-family: "ZCOOL XiaoWei", serif;
    font-size: 19px; letter-spacing: 0.12em; color: #fbefd3; text-shadow: 0 1px 2px rgba(0,0,0,0.6); white-space: nowrap; max-height: calc(100% - 84px); overflow: hidden; }
  .spine .id { position: absolute; bottom: 10px; left: 0; right: 0; text-align: center; font-size: 10px; color: rgba(255, 240, 210, 0.75); letter-spacing: 0.05em; }
  a.spine:hover, a.spine:focus-visible { transform: translateY(-14px); box-shadow: 0 12px 24px rgba(0, 0, 0, 0.6), 0 0 22px color-mix(in srgb, var(--c) 60%, transparent); outline: none; }
  .spine.sealed { filter: saturate(0.35) brightness(0.55); cursor: default; }
  .spine.sealed .id { display: none; }
  .spine.sealed .nm { font-size: 17px; }
  .spine.sealed .wax { position: absolute; left: 50%; bottom: 4px; width: 26px; height: 26px; margin-left: -13px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #c24a4a, var(--seal) 60%, #5a1414); display: grid; place-items: center;
    font-family: "ZCOOL XiaoWei", serif; font-size: 14px; color: #f1c9b0; filter: saturate(2.6) brightness(1.7); }
  .spine.sealed:hover .tip, .spine.sealed:focus-visible .tip { opacity: 1; transform: translate(-50%, -8px); }
  .tip { position: absolute; bottom: 100%; left: 50%; transform: translate(-50%, 0); width: 180px; padding: 10px 12px; border-radius: 10px; pointer-events: none;
    background: rgba(18, 12, 8, 0.95); border: 1px solid var(--gold-dim); font-size: 12.5px; line-height: 1.7; color: #d8caa8; opacity: 0; transition: 0.2s; z-index: 3; text-align: left; }
  .tip b { display: block; color: var(--gold); font-weight: 600; margin-bottom: 2px; }
  .empty-slot { flex: 0 0 auto; width: 62px; height: 150px; border: 1px dashed rgba(232, 194, 122, 0.18); border-bottom: none; border-radius: 4px 4px 0 0; }

  footer { text-align: center; color: var(--dim); font-size: 13px; padding: 10px 0 48px; }
  footer a { color: var(--gold); text-decoration: none; }

  /* ---------- 书页 ---------- */
  .book { display: grid; grid-template-columns: 260px 1fr; gap: 40px; padding: 30px 0 60px; align-items: start; }
  .cover { position: relative; aspect-ratio: 3 / 4.2; border-radius: 6px 12px 12px 6px; padding: 26px 22px; display: flex; flex-direction: column; justify-content: space-between;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.18), transparent 60%), linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 45%, #000));
    box-shadow: inset 10px 0 0 rgba(0,0,0,0.25), inset 12px 0 0 rgba(255,255,255,0.08), 0 20px 40px rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.1); }
  .cover .frame { position: absolute; inset: 12px 12px 12px 22px; border: 1px solid rgba(255, 225, 160, 0.45); border-radius: 4px; pointer-events: none; }
  .cover .cno { position: relative; font-size: 12px; letter-spacing: 0.24em; color: rgba(255, 236, 200, 0.8); text-align: center; }
  .cover .ctitle { position: relative; text-align: center; font-family: "ZCOOL XiaoWei", serif; font-size: 34px; line-height: 1.35; color: #fff3d6; letter-spacing: 0.1em; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
  .cover .cen { position: relative; text-align: center; font-size: 12px; letter-spacing: 0.12em; color: rgba(255, 236, 200, 0.75); }
  .meta .no { color: var(--dim); font-size: 13px; letter-spacing: 0.2em; }
  .meta h1 { margin: 6px 0 12px; font-size: clamp(30px, 5vw, 44px); color: var(--gold); letter-spacing: 0.08em; line-height: 1.3; }
  .chip { display: inline-block; font-size: 12.5px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--gold-dim); color: var(--gold); margin: 0 6px 6px 0; text-decoration: none; }
  a.chip:hover { border-color: var(--gold); background: rgba(232, 194, 122, 0.08); }
  .meta .blurb { font-size: 16px; line-height: 2; color: #dccfb1; margin: 14px 0 20px; }
  .meta h4 { margin: 26px 0 10px; font-size: 14px; letter-spacing: 0.2em; color: var(--dim); font-weight: normal; }
  .toc { list-style: none; margin: 0; padding: 0; border-top: 1px solid rgba(232, 194, 122, 0.15); }
  .toc li { border-bottom: 1px solid rgba(232, 194, 122, 0.15); }
  .toc > li > a, .toc > li > span { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 6px; text-decoration: none; font-size: 15px; }
  .toc > li > a:hover { color: var(--gold); background: rgba(232, 194, 122, 0.05); }
  .toc > li > span { color: rgba(168, 152, 124, 0.55); }
  .toc em { font-style: normal; font-size: 12.5px; color: var(--dim); }
  .btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 24px; border-radius: 999px; border: none; text-decoration: none; font-weight: 600; font-size: 15px;
    color: var(--ink); background: linear-gradient(180deg, #f2d494, #d9ac5c); box-shadow: 0 6px 18px rgba(232, 194, 122, 0.25); transition: gap 0.2s; }
  .btn:hover { gap: 14px; }

  /* ---------- 阅读 ---------- */
  .reader-bar { position: sticky; top: 0; z-index: 5; background: rgba(20, 14, 9, 0.88); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(232, 194, 122, 0.15); }
  .reader-bar .in { display: flex; align-items: center; gap: 12px; height: 52px; }
  .reader-bar .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; color: var(--dim); text-align: center; }
  .reader-bar a, .reader-bar button { flex: 0 0 auto; text-decoration: none; background: none; border: 1px solid rgba(232, 194, 122, 0.25); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--parch); }
  .reader-bar a:hover, .reader-bar button:hover { border-color: var(--gold); color: var(--gold); }
  .prog { height: 2px; background: var(--gold); width: 0; transition: width 0.1s; }
  .page { width: min(700px, 100% - 32px); margin: 0 auto; padding: 46px 0 40px; }
  .page .chap-no { text-align: center; color: var(--dim); font-size: 13px; letter-spacing: 0.3em; }
  .page h2.ch { text-align: center; margin: 8px 0 34px; font-size: 32px; color: var(--gold); letter-spacing: 0.2em; }
  .page h2.ch::after { content: "✦"; display: block; margin-top: 12px; font-size: 13px; color: var(--gold-dim); }
  .text { font-size: var(--fs, 18px); line-height: 2.05; color: #e6d9be; }
  .text p { margin: 0 0 0.9em; text-indent: 2em; }
  .text p.sys { text-indent: 0; padding: 8px 14px; border-left: 2px solid var(--gold-dim); background: rgba(232, 194, 122, 0.05); color: #d9c79d; font-size: 0.92em; }
  .text.prologue p { color: #d8c8a4; }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 46px; padding-top: 22px; border-top: 1px solid rgba(232, 194, 122, 0.15); }
  .pager a, .pager span { flex: 1; padding: 14px 16px; border-radius: 12px; text-decoration: none; border: 1px solid rgba(232, 194, 122, 0.2); font-size: 14px; }
  .pager a:hover { border-color: var(--gold); color: var(--gold); }
  .pager span { opacity: 0.45; }
  .pager .nx { text-align: right; }
  .unwritten { text-align: center; margin-top: 40px; color: var(--dim); font-size: 14px; line-height: 2; }

  /* ---------- 总纲 ---------- */
  .codex { display: grid; grid-template-columns: 200px 1fr; gap: 40px; width: min(1000px, 100% - 32px); margin: 0 auto; padding: 36px 0 60px; }
  .codex nav { position: sticky; top: 70px; align-self: start; font-size: 14px; }
  .codex nav b { display: block; margin-bottom: 10px; color: var(--dim); font-weight: normal; letter-spacing: 0.2em; font-size: 12.5px; }
  .codex nav a { display: block; padding: 6px 0 6px 12px; border-left: 1px solid rgba(232, 194, 122, 0.2); text-decoration: none; color: #cdbf9f; }
  .codex nav a:hover { color: var(--gold); border-color: var(--gold); }
  .md { font-size: 16px; line-height: 2; color: #e3d6ba; min-width: 0; }
  .md h1 { font-family: "ZCOOL XiaoWei", serif; font-weight: normal; font-size: 40px; color: var(--gold); letter-spacing: 0.16em; margin: 0 0 10px; }
  .md h2 { font-family: "ZCOOL XiaoWei", serif; font-weight: normal; font-size: 26px; color: var(--gold); letter-spacing: 0.1em; margin: 46px 0 14px; scroll-margin-top: 70px; }
  .md h3 { font-size: 18px; color: #f0d9a8; margin: 26px 0 8px; }
  .md p, .md ul { margin: 0 0 12px; }
  .md ul { padding-left: 1.4em; }
  .md li { margin: 4px 0; }
  .md strong { color: #f6e2b4; }
  .md blockquote { margin: 0 0 20px; padding: 10px 18px; border-left: 2px solid var(--gold); background: rgba(232, 194, 122, 0.05); color: #cfc1a0; }
  .md blockquote p { margin: 0; }
  .md hr { border: none; height: 1px; background: linear-gradient(90deg, transparent, var(--gold-dim), transparent); margin: 34px 0; }
  .md .tw { overflow-x: auto; margin: 0 0 16px; }
  .md table { border-collapse: collapse; width: 100%; font-size: 14.5px; line-height: 1.75; }
  .md th, .md td { border: 1px solid rgba(232, 194, 122, 0.2); padding: 8px 12px; text-align: left; vertical-align: top; }
  .md th { color: var(--gold); font-weight: 600; background: rgba(232, 194, 122, 0.06); }

  .loading { text-align: center; padding: 80px 0; color: var(--dim); letter-spacing: 0.2em; }

  @keyframes breathe { 50% { opacity: 0.55; transform: scale(1.1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .fade { animation: rise 0.5s ease both; }
  @media (max-width: 760px) {
    .book { grid-template-columns: 1fr; gap: 26px; }
    .cover { width: 200px; margin: 0 auto; }
    .cover .ctitle { font-size: 26px; }
    .codex { grid-template-columns: 1fr; gap: 10px; }
    .codex nav { position: static; display: flex; flex-wrap: wrap; gap: 4px 14px; }
    .codex nav b { width: 100%; margin: 0; }
    .codex nav a { border: none; padding: 2px 0; }
    .lectern { grid-template-columns: 1fr; text-align: center; padding: 20px; }
    .open-book { width: 170px; margin: 6px auto 0; }
    .row { min-height: 220px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<body>
<canvas id="stars"></canvas>
<div id="app"><div class="loading">正在点灯</div></div>

<script src="catalog.js"></script>
<script>
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  const A = window.ARCHIVE;
  const app = document.getElementById('app');
  const NUM = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十'];
  const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('archive:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('archive:' + k, JSON.stringify(v)); } catch {} },
  };
  const bookById = id => A.books.find(b => b.id === id);
  const gameLink = id => { const g = A.games[id]; return g ? `<a class="chip" href="https://hitanorain.github.io/${id}/">${g.icon} ${g.name}</a>` : ''; };

  // ---------- 读取正文 ----------
  const cache = {};
  async function load(book) {
    if (!cache[book.id]) cache[book.id] = fetch(book.file).then(r => { if (!r.ok) throw new Error(r.status); return r.text(); });
    return cache[book.id];
  }
  // oh-story 正文：标记前是导语，###1. 之类的标记切分小节
  function parseStory(text) {
    const marker = /^###\s*(?:(\d+)\.|第([一二三四五六七八九十百零〇0-9]+)章)\s*$/;
    const chapters = []; let cur = { title: '引子', lines: [], prologue: true };
    for (const raw of text.replace(/\r/g, '').split('\n')) {
      const line = raw.trim();
      if (marker.test(line)) { if (cur.lines.length || !cur.prologue) chapters.push(cur); cur = { title: NUM[chapters.length + (chapters[0]?.prologue ? 0 : 1)] || String(chapters.length + 1), lines: [] }; continue; }
      if (line) cur.lines.push(line);
    }
    if (cur.lines.length) chapters.push(cur);
    // 重新编号：引子之后依次为 一、二、三
    let n = 0; for (const c of chapters) if (!c.prologue) c.title = NUM[++n] || String(n);
    return chapters;
  }
  // 总纲用的小型 Markdown：标题、段落、引用、列表（可嵌套）、表格、分隔线、加粗、行内代码
  function renderMd(src) {
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
    const lines = src.replace(/\r/g, '').split('\n'); let out = '', i = 0;
    const cells = l => l.trim().replace(/^\||\|$/g, '').split('|').map(c => c.trim());
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { i++; continue; }
      let m;
      if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; i++; continue; }
      if (/^---+\s*$/.test(l)) { out += '<hr>'; i++; continue; }
      if (l.startsWith('>')) {
        const buf = []; while (i < lines.length && lines[i].startsWith('>')) buf.push(lines[i++].replace(/^>\s?/, ''));
        out += '<blockquote>' + buf.join('\n').split(/\n\s*\n/).map(p => `<p>${p.split('\n').map(inline).join('<br>')}</p>`).join('') + '</blockquote>'; continue;
      }
      if (l.trim().startsWith('|')) {
        const rows = []; while (i < lines.length && lines[i].trim().startsWith('|')) rows.push(cells(lines[i++]));
        const body = rows.filter((r, k) => !(k === 1 && r.every(c => /^:?-{3,}:?$/.test(c))));
        out += '<table><thead><tr>' + body[0].map(c => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>' +
          body.slice(1).map(r => '<tr>' + r.map(c => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') + '</tbody></table>'; continue;
      }
      if (/^\s*[-*]\s+/.test(l)) {
        let html = '', depth = -1;
        while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
          const d = Math.floor(lines[i].match(/^\s*/)[0].length / 2), text = lines[i].replace(/^\s*[-*]\s+/, '');
          if (d > depth) html += '<ul>'.repeat(d - depth); else html += '</li>' + '</ul></li>'.repeat(depth - d);
          html += '<li>' + inline(text); depth = d; i++;
        }
        out += html + '</li>' + '</ul></li>'.repeat(depth) + '</ul>'; continue;
      }
      const buf = []; while (i < lines.length && lines[i].trim() && !/^(#{1,3}\s|>|\||---+\s*$|\s*[-*]\s+)/.test(lines[i])) buf.push(lines[i++]);
      out += `<p>${buf.map(inline).join('<br>')}</p>`;
    }
    return out;
  }
  // 稿子里是半角 ""，阅读时换成中文弯引号
  const curly = s => { let open = false; return s.replace(/"/g, () => (open = !open) ? '“' : '”'); };
  const renderLines = lines => lines.map(l => /^【.*】$/.test(l) ? `<p class="sys">${esc(l)}</p>` : `<p>${esc(curly(l))}</p>`).join('');

  // ---------- 大厅 ----------
  function hall() {
    const codex = bookById('codex');
    const spine = b => {
      const h = 190 + ([...b.id].reduce((s, c) => s + c.charCodeAt(0), 0) % 50);
      if (b.sealed) return `<div class="spine sealed" tabindex="0" style="--c:${b.color};height:${h}px" aria-label="${esc(b.title)}，未启封">
          <span class="nm">${esc(b.title)}</span><span class="wax">封</span><span class="id">${esc(b.no)}</span>
          <span class="tip"><b>未启封</b>${esc(b.blurb)}</span></div>`;
      return `<a class="spine" href="#/book/${b.id}" style="--c:${b.color};height:${h}px" aria-label="${esc(b.title)}">
          <span class="nm">${esc(b.title)}</span><span class="id">${esc(b.no)}</span></a>`;
    };
    const shelves = A.shelves.filter(s => s.id !== 'codex').map((s, i) => {
      const books = A.books.filter(b => b.shelf === s.id);
      const slots = Math.max(0, 6 - books.length);
      return `<section class="shelf-sec fade" style="animation-delay:${0.15 + i * 0.1}s">
        <div class="plaque"><h3 class="t">${s.name}</h3><span class="s">${s.sub}</span><p>${s.desc}</p></div>
        <div class="case"><div class="row">${books.map(spine).join('')}${'<div class="empty-slot" aria-hidden="true"></div>'.repeat(slots)}</div><div class="plank"></div></div>
      </section>`;
    }).join('');
    app.innerHTML = `<div class="wrap">
      <a class="back" href="../">← 回到游戏厅</a>
      <header class="hall-head fade">
        <div class="door" aria-hidden="true"></div>
        <h1 class="t">星叶档案馆</h1>
        <p class="sub">收藏星叶宇宙里，每一个被记住的故事</p>
        <p class="rules">进馆请放轻脚步。<br>书架上亮着的书可以借阅；封着蜡印的，还没有人把它写完。<br>这里的书越多，世界上被遗忘的东西就越少。</p>
      </header>
      <a class="lectern fade" href="#/codex" style="animation-delay:.08s">
        <div class="open-book" aria-hidden="true"><div class="glow"></div><div class="pg l"></div><div class="pg r"></div></div>
        <div><div class="no">卷首 · ${esc(codex.no)} · ${esc(codex.status)}</div><h2 class="t">${esc(codex.title)}</h2>
          <p>${esc(codex.blurb)}</p><span class="go">翻开总纲 →</span></div>
      </a>
      ${shelves}
      <footer>星叶宇宙 · <a href="../">Hitanorain 的游戏厅</a></footer>
    </div>`;
  }

  // ---------- 书页 ----------
  async function bookPage(id) {
    const b = bookById(id);
    if (!b || b.sealed) return go('#/');
    if (b.kind === 'codex') return go('#/codex');
    app.innerHTML = `<div class="loading">正在取书</div>`;
    let chapters = [];
    try { chapters = parseStory(await load(b)); } catch { }
    const last = store.get('last:' + b.id, null);
    const planned = Math.max(b.planned || 0, chapters.filter(c => !c.prologue).length);
    const written = chapters.filter(c => !c.prologue).length;
    const rows = chapters.map((c, i) => `<li><a href="#/read/${b.id}/${i}"><span>${c.prologue ? '引子' : '第' + c.title + '节'}</span><em>${c.lines.join('').length} 字</em></a></li>`);
    for (let n = written + 1; n <= planned; n++) rows.push(`<li><span><span>第${NUM[n] || n}节</span><em>尚未写成</em></span></li>`);
    const startAt = last != null && last < chapters.length ? last : 0;
    app.innerHTML = `<div class="wrap fade">
      <a class="back" href="#/">← 回到书架</a>
      <div class="book">
        <div class="cover" style="--c:${b.color}"><div class="frame"></div>
          <div class="cno">${esc(b.no)}</div><div class="ctitle">${esc(b.title)}</div><div class="cen">${esc(b.en || '')}</div></div>
        <div class="meta">
          <div class="no">${esc(A.shelves.find(s => s.id === b.shelf).name)} · ${esc(b.no)}</div>
          <h1 class="t">${esc(b.title)}</h1>
          <span class="chip">${esc(b.status || '')}</span><span class="chip">已写 ${written} / ${planned} 节</span>
          <p class="blurb">${esc(b.blurb)}</p>
          ${chapters.length ? `<a class="btn" href="#/read/${b.id}/${startAt}">${last != null ? '继续阅读' : '开始阅读'} <span aria-hidden="true">→</span></a>` : '<p class="unwritten">这本书的正文还没送到馆里。</p>'}
          ${b.games?.length ? `<h4>相关现场</h4><div>${b.games.map(gameLink).join('')}</div>` : ''}
          <h4>目录</h4><ul class="toc">${rows.join('')}</ul>
        </div>
      </div>
    </div>`;
    scrollTo(0, 0);
  }

  // ---------- 阅读 ----------
  async function read(id, idx) {
    const b = bookById(id);
    if (!b || b.sealed || b.kind === 'codex') return go('#/');
    app.innerHTML = `<div class="loading">正在翻页</div>`;
    let chapters;
    try { chapters = parseStory(await load(b)); } catch { app.innerHTML = `<div class="loading">这本书暂时取不出来</div>`; return; }
    const i = Math.min(Math.max(0, idx | 0), chapters.length - 1), c = chapters[i];
    store.set('last:' + b.id, i);
    const fs = store.get('fs', 18);
    const prev = chapters[i - 1], next = chapters[i + 1];
    const label = ch => ch.prologue ? '引子' : '第' + ch.title + '节';
    const isLast = !next && (b.planned || 0) > chapters.filter(x => !x.prologue).length;
    app.innerHTML = `<div class="reader-bar"><div class="wrap in">
        <a href="#/book/${b.id}">目录</a><div class="ttl">${esc(b.title)} · ${label(c)}</div>
        <button data-fs="-1" aria-label="字号变小">A−</button><button data-fs="1" aria-label="字号变大">A+</button>
      </div><div class="prog" id="prog"></div></div>
      <article class="page fade">
        <div class="chap-no">${esc(b.title)}</div>
        <h2 class="ch t">${label(c)}</h2>
        <div class="text ${c.prologue ? 'prologue' : ''}" id="text" style="--fs:${fs}px">${renderLines(c.lines)}</div>
        ${isLast ? '<p class="unwritten">✦<br>后面的章节还在写。<br>书签已经替你夹好了。</p>' : ''}
        <nav class="pager">
          ${prev ? `<a href="#/read/${b.id}/${i - 1}">← ${label(prev)}</a>` : `<a href="#/book/${b.id}">← 回到目录</a>`}
          ${next ? `<a class="nx" href="#/read/${b.id}/${i + 1}">${label(next)} →</a>` : `<span class="nx">未完待续</span>`}
        </nav>
      </article>`;
    scrollTo(0, 0);
    app.querySelectorAll('[data-fs]').forEach(btn => btn.onclick = () => {
      const v = Math.min(24, Math.max(15, store.get('fs', 18) + +btn.dataset.fs));
      store.set('fs', v); document.getElementById('text').style.setProperty('--fs', v + 'px');
    });
  }

  // ---------- 总纲 ----------
  async function codexPage() {
    const b = bookById('codex');
    app.innerHTML = `<div class="loading">正在翻开总纲</div>`;
    let md;
    try { md = await load(b); } catch { app.innerHTML = `<div class="loading">总纲暂时取不出来</div>`; return; }
    const html = renderMd(md);
    app.innerHTML = `<div class="reader-bar"><div class="wrap in"><a href="#/">书架</a><div class="ttl">卷首 · ${esc(b.title)}</div></div><div class="prog" id="prog"></div></div>
      <div class="codex fade"><nav id="cnav"><b>目录</b></nav><article class="md" id="md">${html}</article></div>`;
    const art = document.getElementById('md'), nav = document.getElementById('cnav');
    art.querySelectorAll('table').forEach(t => { const w = document.createElement('div'); w.className = 'tw'; t.replaceWith(w); w.appendChild(t); });
    art.querySelectorAll('h2').forEach((h, k) => {
      h.id = 'sec-' + k;
      const a = document.createElement('a'); a.href = '#'; a.textContent = h.textContent;
      a.onclick = e => { e.preventDefault(); h.scrollIntoView({ behavior: 'smooth' }); };
      nav.appendChild(a);
    });
    scrollTo(0, 0);
  }

  // ---------- 路由 ----------
  function go(h) { location.hash = h; }
  function route() {
    const p = location.hash.replace(/^#\/?/, '').split('/');
    if (p[0] === 'book') return bookPage(p[1]);
    if (p[0] === 'read') return read(p[1], +p[2]);
    if (p[0] === 'codex') return codexPage();
    hall(); scrollTo(0, 0);
  }
  addEventListener('hashchange', route);
  addEventListener('scroll', () => {
    const el = document.getElementById('prog'); if (!el) return;
    const max = document.documentElement.scrollHeight - innerHeight;
    el.style.width = (max > 0 ? Math.min(100, scrollY / max * 100) : 0) + '%';
  }, { passive: true });
  route();

  // ---------- 穹顶星光 ----------
  const cv = document.getElementById('stars'), cx = cv.getContext('2d');
  let stars = [];
  function resize() {
    const d = Math.min(2, devicePixelRatio || 1);
    cv.width = innerWidth * d; cv.height = innerHeight * d; cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
    cx.setTransform(d, 0, 0, d, 0, 0);
    stars = Array.from({ length: Math.round(innerWidth * innerHeight / 11000) }, () => ({
      x: Math.random() * innerWidth, y: Math.random() * innerHeight * 0.5, r: Math.random() * 1.2 + 0.3, p: Math.random() * 6, s: 0.4 + Math.random() * 1.2,
    }));
  }
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(t) {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    for (const s of stars) {
      const a = 0.2 + 0.55 * (0.5 + 0.5 * Math.sin(t / 1000 * s.s + s.p));
      cx.fillStyle = `rgba(255, 236, 200, ${a * (1 - s.y / (innerHeight * 0.5))})`;
      cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, Math.PI * 2); cx.fill();
    }
    if (!still) requestAnimationFrame(draw);
  }
  addEventListener('resize', () => { resize(); if (still) draw(0); });
  resize(); requestAnimationFrame(draw);
</script>
</body>
</html>

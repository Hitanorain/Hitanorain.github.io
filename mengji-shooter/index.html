<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>萌鸡突围</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
:root{--egg:#f6c94a;--cream:#fff4d6;--ink:#2a2116;--good:#7dff9a;--bad:#ff5a4a;--panel:rgba(16,18,14,.62);--line:rgba(255,255,255,.1);--title:"ZCOOL KuaiLe","Microsoft YaHei",system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#24331a;font-family:system-ui,"Microsoft YaHei","PingFang SC",sans-serif;color:#eee;user-select:none;-webkit-user-select:none}
canvas{display:block}
body.playing,body.playing *{cursor:none!important}
[hidden]{display:none!important}
.pn{position:fixed;background:var(--panel);border:1px solid var(--line);border-radius:8px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 4px 18px rgba(0,0,0,.18)}
body:not(.playing) .hud{display:none!important}

/* 左上：任务面板 */
#mission{left:16px;top:14px;padding:9px 14px 10px;min-width:170px}
#mission b{display:block;font:22px var(--title);color:var(--egg);letter-spacing:2px;margin-bottom:5px}
#mission .chk{display:flex;align-items:center;gap:7px;font-size:13.5px}
#mission .box{width:11px;height:11px;border:1.6px solid rgba(255,255,255,.75);border-radius:2px;flex:none}
#mission .chk.done .box{background:var(--good);border-color:var(--good)}
#mSub{font-size:12px;opacity:.72;margin-top:5px;max-width:240px;line-height:1.45}
/* 顶部中间：撤离点距离 */
#dist{left:50%;top:14px;transform:translateX(-50%);padding:6px 14px;display:flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
#dist svg{width:16px;height:16px}#dist b{font:600 15px ui-monospace,Consolas,monospace;color:var(--good);margin-left:2px}
#dist.hold{border-color:rgba(255,241,160,.45)}#dist.hold b{color:#fff1a0}
#holdBar{position:absolute;left:10px;right:10px;bottom:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}#holdBar div{height:100%;width:0;background:#fff1a0}
/* 右上：指南针 */
#compass{position:fixed;right:18px;top:14px;width:58px;height:58px;border-radius:50%;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(4px)}
#compass .n{position:absolute;left:0;right:0;top:3px;text-align:center;font:700 12px system-ui;color:#fff}
#compass .tk{position:absolute;inset:6px;border-radius:50%;border:1px dashed rgba(255,255,255,.14)}
#arrow{position:absolute;left:50%;top:50%;width:0;height:0;transition:transform .12s linear}
#arrow::before{content:"";position:absolute;left:-7px;top:-12px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:16px solid var(--good)}
/* 左下：生命、体力 */
#stat{left:16px;bottom:16px;padding:9px 12px 10px;width:208px}
#hearts{display:flex;gap:4px;font-size:19px;line-height:1}
#hearts i{font-style:normal;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}#hearts i.off{opacity:.22;filter:grayscale(1)}#hearts i.sh{filter:drop-shadow(0 0 4px #9fe6ff)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:8px}.bar div{height:100%;background:#e8c547;width:100%}
/* 右下：武器、道具、背包 */
#weapon{right:16px;bottom:16px;padding:9px 13px 10px;min-width:180px;text-align:right}
#weapon .wn{font-size:12px;opacity:.7}#weapon .wb{font:600 18px var(--title);letter-spacing:1px;color:var(--cream);margin:1px 0 6px}
#buffs{display:flex;flex-direction:column;gap:3px;align-items:flex-end;margin-bottom:6px}
.buff{font-size:12px;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;gap:6px;align-items:center}.buff b{font:600 12px ui-monospace,Consolas,monospace}
#inv{display:flex;gap:10px;justify-content:flex-end;font-size:13px}#inv span b{font-family:ui-monospace,Consolas,monospace;margin-left:3px}
/* 准星 */
#cross{position:fixed;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;pointer-events:none;z-index:5}
#cross svg{width:100%;height:100%;overflow:visible;transition:transform .06s}#cross.hit svg{transform:scale(1.3)}#cross.hit circle,#cross.hit line{stroke:#ffb0a0}
/* 交互提示 */
#prompt{position:fixed;left:0;top:0;pointer-events:none;width:150px;margin:-62px 0 0 -75px;text-align:center;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#prompt .k{display:inline-block;background:var(--cream);color:var(--ink);font-weight:700;border-radius:3px;padding:0 6px;margin-right:5px;text-shadow:none}
#prompt .bar{height:5px;margin-top:5px}#prompt .bar div{background:var(--egg);width:0}
/* 中央横幅、浮动文字、提示条 */
#banner{position:fixed;left:50%;top:24%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .35s}
#banner.on{opacity:1}#banner b{display:block;font:44px var(--title);color:var(--egg);letter-spacing:4px;text-shadow:0 3px 0 rgba(60,40,0,.55),0 0 24px rgba(0,0,0,.35)}#banner span{display:block;font-size:15px;margin-top:6px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.ft{position:fixed;pointer-events:none;font:700 14px system-ui,"Microsoft YaHei";text-shadow:0 1px 2px rgba(0,0,0,.8),0 0 6px rgba(0,0,0,.4);white-space:nowrap;transform:translate(-50%,-50%);z-index:4}
#tip{left:50%;bottom:16px;transform:translateX(-50%);padding:6px 14px;font-size:12.5px;opacity:.9;white-space:nowrap;max-width:calc(100vw - 480px);overflow:hidden;text-overflow:ellipsis}
#tip k,.scr k{display:inline-block;background:rgba(255,255,255,.16);border-radius:3px;padding:0 5px;margin:0 2px;font-size:11.5px}
/* 屏幕：标题 / 暂停 / 结算 */
.scr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(20,26,14,.35),rgba(10,12,8,.82));z-index:20;padding:16px;box-sizing:border-box}
.card{background:rgba(22,26,18,.86);border:1px solid var(--line);border-radius:14px;padding:26px 30px 24px;max-width:520px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center}
.card h1{margin:0;font:56px var(--title);color:var(--egg);letter-spacing:6px;text-shadow:0 4px 0 rgba(70,46,0,.6)}
.card h2{margin:0 0 6px;font:36px var(--title);letter-spacing:3px}
.card p{margin:10px 0;font-size:14px;line-height:1.7;opacity:.85}
.card .keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:13px;margin:16px auto;max-width:330px;opacity:.9}
.card .keys span:nth-child(odd){text-align:right;opacity:.75}
.card .stats{display:flex;justify-content:center;gap:22px;margin:16px 0 4px;font-size:13px}.card .stats div b{display:block;font:600 24px ui-monospace,Consolas,monospace;color:var(--cream);margin-bottom:2px}
.btn{font:20px var(--title);letter-spacing:3px;background:var(--egg);color:var(--ink);border:0;border-radius:10px;padding:10px 34px;margin-top:14px;cursor:pointer;box-shadow:0 4px 0 #b08a1e}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b08a1e}
.btn.ghost{background:transparent;color:#eee;box-shadow:none;border:1px solid var(--line);font-size:15px;padding:8px 20px;margin-left:8px}
.card a.lobby{display:inline-block;font-size:15px;letter-spacing:2px;color:#eee;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:8px 20px;margin:14px 0 0 8px;vertical-align:baseline}
.card a.lobby:hover{background:rgba(255,255,255,.08)}.card a.lobby:focus-visible,.btn:focus-visible{outline:2px solid var(--egg);outline-offset:3px}
.lobbyrow{text-align:left;margin:-10px 0 4px -8px}.card a.lobby.top{margin:0;padding:5px 12px;font-size:13px;letter-spacing:1px;opacity:.8}.card a.lobby.top:hover{opacity:1}
.lost{color:#ff9a8a}.kept{color:var(--good)}
/* 等级、经验 */
.lvrow{display:flex;align-items:center;gap:8px;margin-top:8px}.lvrow b{font:600 13px ui-monospace,Consolas,monospace;color:#c8ff7a;min-width:38px}.lvrow .bar{flex:1;margin:0}#xpBar{background:#b6ff6a;width:0}
#weapon .ws{font:12px ui-monospace,Consolas,monospace;opacity:.7;margin:-4px 0 6px}
#ups{display:flex;flex-wrap:wrap;gap:3px;justify-content:flex-end;max-width:240px;margin:0 0 6px auto}#ups span{font-size:12px;background:rgba(255,255,255,.08);border-radius:4px;padding:1px 4px}#ups span b{font:600 10px ui-monospace,Consolas,monospace;margin-left:1px;opacity:.85}
/* 头目血条 */
#boss{left:50%;top:58px;transform:translateX(-50%);width:min(420px,calc(100vw - 32px));padding:6px 12px 8px;text-align:center;font:600 13px system-ui,"Microsoft YaHei";color:#ffd0a0;box-sizing:border-box}
#boss .bar{height:8px;margin-top:5px}#bossBar{background:linear-gradient(90deg,#ff5a3a,#ffb040)}
/* 升级三选一 */
#pick{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(ellipse at 50% 50%,rgba(20,30,10,.35),rgba(8,10,6,.78));padding:16px;box-sizing:border-box}
#pick h3{margin:0;font:40px var(--title);color:#c8ff7a;letter-spacing:4px;text-shadow:0 3px 0 rgba(30,60,0,.6)}#pick p{margin:-10px 0 0;font-size:13px;opacity:.8}
#cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ucard{width:190px;background:rgba(24,30,18,.92);border:1px solid rgba(200,255,122,.25);border-radius:12px;padding:16px 14px 14px;text-align:center;cursor:pointer;transition:transform .12s,border-color .12s;font:inherit;color:inherit}
.ucard:hover,.ucard:focus-visible{transform:translateY(-4px);border-color:#c8ff7a;outline:none}
.ucard .ic{font-size:34px;line-height:1.2}.ucard b{display:block;font:20px var(--title);color:var(--cream);margin:6px 0 4px;letter-spacing:1px}.ucard span{display:block;font-size:13px;opacity:.85;line-height:1.5;min-height:40px}
.ucard i{display:block;font-style:normal;font:12px ui-monospace,Consolas,monospace;color:#c8ff7a;margin-top:8px}.ucard kbd{display:inline-block;margin-top:8px;font:11px ui-monospace,Consolas,monospace;border:1px solid rgba(255,255,255,.25);border-radius:3px;padding:0 5px;opacity:.7}
@media (max-width:720px){#tip{display:none}#mission{transform:scale(.88);transform-origin:left top}}
</style></head><body>
<div id="mission" class="pn hud"><b>撤离行动</b><div class="chk" id="mChk"><i class="box"></i><span id="mText">到达撤离点 · 0/3</span></div><div id="mSub"></div></div>
<div id="dist" class="pn hud"><svg viewBox="0 0 24 24" fill="#7dff9a"><circle cx="14" cy="4" r="2.4"/><path d="M12.6 7.2l-3.8 2.1-1.6 4 1.8.7 1.3-3 1.6-.8-1.6 5.6-3.6 4.4 1.6 1.3 4-4.8.9-2.6 2.3 2.6V22h2v-6.2l-2.6-3 .9-3.2 1.3 1.9 3.3 1.1.6-1.9-2.6-.9-2-3.1c-.5-.8-1.6-1.2-2.5-.8z"/></svg><span id="distT">撤离点</span><b id="distN">--</b><div id="holdBar" hidden><div></div></div></div>
<div id="compass" class="hud"><div class="tk"></div><div class="n">N</div><div id="arrow"></div></div>
<div id="stat" class="pn hud"><div id="hearts"></div><div class="lvrow"><b id="lv">Lv 1</b><div class="bar"><div id="xpBar"></div></div></div><div class="bar"><div id="stBar"></div></div></div>
<div id="weapon" class="pn hud"><div class="wn">武器</div><div class="wb" id="wName">玉米发射器</div><div class="ws" id="wStat"></div><div id="ups"></div><div id="buffs"></div><div id="inv"><span>💨 臭蛋<b id="iStink">2</b></span><span>🌽<b id="iCoin">0</b></span><span>🥚<b id="iGold">0</b></span></div></div>
<div id="tip" class="pn hud"></div>
<div id="cross" class="hud"><svg viewBox="-17 -17 34 34"><circle r="9" fill="none" stroke="#fff" stroke-width="1.6" opacity=".9"/><line x1="0" y1="-15" x2="0" y2="-11" stroke="#fff" stroke-width="1.6"/><line x1="0" y1="15" x2="0" y2="11" stroke="#fff" stroke-width="1.6"/><line x1="-15" y1="0" x2="-11" y2="0" stroke="#fff" stroke-width="1.6"/><line x1="15" y1="0" x2="11" y2="0" stroke="#fff" stroke-width="1.6"/><circle r="1.4" fill="#fff"/></svg></div>
<div id="prompt" class="hud" hidden><span class="k">E</span><span id="pText">搜索</span><div class="bar"><div id="pBar"></div></div></div>
<div id="boss" class="pn hud" hidden><span id="bossName"></span><div class="bar"><div id="bossBar"></div></div></div>
<div id="pick" hidden><h3>升级！</h3><p>选择一项强化，按 <b>1</b> / <b>2</b> / <b>3</b> 或点击</p><div id="cards"></div></div>
<div id="banner"><b id="bT"></b><span id="bS"></span></div>
<div id="screen" class="scr"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="shooter/main.js"></script>
</body></html>
